reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main", "master"]

path_filters:
  - "!**/*.gguf"
  - "!**/models/**"
  - "!**/*.db"
  - "!**/__pycache__/**"

# Lattice law
