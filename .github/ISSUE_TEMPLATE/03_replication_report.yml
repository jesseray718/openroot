name: Replication Report
description: Report replication outcome of a method/script
title: "[Replication] "
labels: ["replication"]
body:
  - type: input
    id: target
    attributes:
      label: Target artifact
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
  - type: textarea
    id: steps
    attributes:
      label: Steps run
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result (pass/fail + notes)
    validations:
      required: true
