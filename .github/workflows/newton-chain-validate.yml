name: Newton Chain validation
on:
  pull_request:
    paths:
      - "docs/NEWTON_CHAIN.md"
      - "docs/newton_chain/**"
      - "scripts/validate_newton_chain.py"
      - "tests/test_newton_chain_validate.py"
      - ".github/workflows/newton-chain-validate.yml"
  push:
    branches: [main]
    paths:
      - "docs/NEWTON_CHAIN.md"
      - "docs/newton_chain/**"
      - "scripts/validate_newton_chain.py"
      - "tests/test_newton_chain_validate.py"
      - ".github/workflows/newton-chain-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pyyaml
      - run: python3 scripts/validate_newton_chain.py
      - run: python3 -m unittest discover -s tests -p test_newton_chain_validate.py
