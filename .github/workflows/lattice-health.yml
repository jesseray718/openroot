name: Lattice Health

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check critical files
        run: |
          echo "Checking lattice integrity..."
          test -f agape_engine.py && echo "agape_engine.py present" || echo "MISSING agape_engine.py"
          test -f .coderabbit.yaml && echo ".coderabbit.yaml present" || echo "MISSING .coderabbit.yaml"
          test -f agape_mesh_advertise.py && echo "agape_mesh_advertise.py present" || echo "MISSING agape_mesh_advertise.py"
          wc -c agape_engine.py .coderabbit.yaml agape_mesh_advertise.py || true
      - name: Report
        run: |
          echo "Lattice health check complete"
          echo "Operator: Jesse Ray | OpenRoot"
          echo "eta / R=1.0 enforced"
