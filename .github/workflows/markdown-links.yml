name: Markdown relative links
on: [push, pull_request]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p test_check_markdown_links.py
      - run: python3 scripts/check_markdown_links.py
