# SPDX-License-Identifier: GPL-3.0-or-later
name: OpenRoot CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openroot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deterministic repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tracked source and policy
        run: python scripts/superloop_preflight.py

      - name: Validate model registry
        run: python scripts/validate_registry.py

      - name: Validate changed Git whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check HEAD
          fi

      - name: Generate redacted dashboard artifact
        run: python scripts/superloop_status.py

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: superloop-dashboard
          path: context_bridge/superloop_DASHBOARD.md
          if-no-files-found: error
          retention-days: 14
