name: openroot-ci-cd
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax gate (py_compile all bin/*.py)
        run: |
          FAIL=0
          for f in bin/*.py; do
            python3 -W ignore -m py_compile "$f" || { echo "FAIL $f"; FAIL=1; }
          done
          exit $FAIL
      - name: SPDX license header gate (authored scripts only)
        run: |
          FAIL=0
          for f in bin/*.py; do
            case "$f" in
              bin/[0-9][0-9][0-9][0-9]_*) continue ;;
            esac
            grep -q "SPDX-License-Identifier: GPL-3.0-only" "$f" || { echo "NO-SPDX $f"; FAIL=1; }
          done
          exit $FAIL
      - name: Shell syntax gate (bash -n all bin/*.sh)
        run: |
          FAIL=0
          for f in bin/*.sh; do
            bash -n "$f" || { echo "FAIL $f"; FAIL=1; }
          done
          exit $FAIL

  build:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release manifest (bin/ fleet inventory + hashes)
        run: |
          mkdir -p dist
          {
            echo "# OpenRoot ${{ github.ref_name }} — bin/ fleet manifest"
            echo "| file | sha256 |"
            echo "|------|--------|"
            for f in bin/*.py; do
              echo "| $f | $(sha256sum "$f" | cut -d' ' -f1) |"
            done
          } > dist/MANIFEST.md
          tar czf dist/openroot-bin-${{ github.ref_name }}.tar.gz bin/*.py bin/*.sh 2>/dev/null || tar czf dist/openroot-bin-${{ github.ref_name }}.tar.gz bin/*.py
      - name: Release (CD)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openroot-bin-${{ github.ref_name }}.tar.gz
            dist/MANIFEST.md
          generate_release_notes: true

  deploy-pages:
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: pages-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Compose landing page from README + manifest stub
        run: |
          mkdir -p site
          python3 - <<'PY'
          import re, pathlib
          md = pathlib.Path("README.md").read_text(encoding="utf-8", errors="replace")
          html_body = "".join(f"<p>{l}</p>" for l in md.splitlines() if l.strip())[:60000]
          html = f"""<!DOCTYPE html><html><head><meta charset="utf-8">
          <title>OpenRoot</title>
          <style>body{{font-family:sans-serif;max-width:60em;margin:2em auto;padding:0 1em;line-height:1.6}}</style>
          </head><body><h1>OpenRoot</h1>{html_body}</body></html>"""
          pathlib.Path("site/index.html").write_text(html)
          PY
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: openroot
