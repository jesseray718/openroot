# SPDX-License-Identifier: GPL-3.0-or-later
name: Instruments Before Builders

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instruments-before-builders-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Changed-script gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "revision=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "revision=HEAD^" >> "$GITHUB_OUTPUT"
          else
            echo "revision=" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect changed first-party bin scripts
        shell: bash
        env:
          BASE_REVISION: ${{ steps.base.outputs.revision }}
        run: |
          set -euo pipefail

          if [ -n "$BASE_REVISION" ]; then
            git diff --diff-filter=ACMR --name-only "$BASE_REVISION...HEAD" > /tmp/changed-files.txt
          else
            git ls-files > /tmp/changed-files.txt
          fi

          : > /tmp/python-files.txt
          : > /tmp/shell-files.txt

          while IFS= read -r path; do
            case "$path" in
              bin/*.py)
                case "$path" in
                  bin/[0-9][0-9][0-9][0-9]_*) ;;
                  *) printf '%s\n' "$path" >> /tmp/python-files.txt ;;
                esac
                ;;
              bin/*.sh)
                printf '%s\n' "$path" >> /tmp/shell-files.txt
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "Selected Python scripts:"
          cat /tmp/python-files.txt || true

          echo "Selected shell scripts:"
          cat /tmp/shell-files.txt || true

      - name: Compile changed first-party Python scripts
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s /tmp/python-files.txt ]; then
            echo "No changed first-party Python scripts."
            exit 0
          fi

          while IFS= read -r file; do
            python3 -m py_compile "$file"
            echo "PASS Python: $file"
          done < /tmp/python-files.txt

      - name: SPDX gate for changed first-party scripts
        shell: bash
        run: |
          set -euo pipefail

          status=0

          while IFS= read -r file; do
            if ! grep -q "SPDX-License-Identifier: GPL-3.0" "$file"; then
              echo "Missing SPDX marker: $file"
              status=1
            fi
          done < <(cat /tmp/python-files.txt /tmp/shell-files.txt)

          exit "$status"

      - name: Parse changed first-party shell scripts
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s /tmp/shell-files.txt ]; then
            echo "No changed first-party shell scripts."
            exit 0
          fi

          while IFS= read -r file; do
            bash -n "$file"
            echo "PASS shell: $file"
          done < /tmp/shell-files.txt
