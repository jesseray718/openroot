name: Thermal Cascade Validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run thermal cascade
        run: |
          python bin/thermal_cascade_v2.py --validate
          python bin/thermal_optimal_balance.py --benchmark
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thermal-results
          path: projects/openroot/research/thermal-systems/*.json
