name: Documentation build

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs-build.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-links:
    name: markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Verify local Markdown links
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          failures = []
          for path in [Path("README.md"), *Path("docs").rglob("*.md")]:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for target in re.findall(r"\]\(([^)]+)\)", text):
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  relative = target.split("#", 1)[0]
                  if not relative:
                      continue
                  candidate = (path.parent / relative).resolve()
                  if not candidate.exists():
                      failures.append(f"{path}: broken local link: {target}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("Local Markdown links passed.")
          PY

  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Create minimal documentation artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist
          mkdir -p dist
          cp README.md dist/index.md
          cp -a docs dist/docs
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
