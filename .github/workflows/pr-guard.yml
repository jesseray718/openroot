name: pr-guard

on: pull_request

jobs:
  size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block large binaries / embedded .git
        run: |
          git diff --name-only origin/main...HEAD | while read f; do
            if [[ "$f" =\~ \.git/ ]]; then
              echo "ERROR: Embedded .git directory detected: $f"
              exit 1
            fi
            if [[ -f "$f" ]] && [[ $(stat -c%s "$f") -gt 5000000 ]]; then
              echo "ERROR: File >5MB added: $f"
              exit 1
            fi
          done
