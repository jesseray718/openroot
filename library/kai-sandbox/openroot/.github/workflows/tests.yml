name: OpenRoot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install pytest
          # add other deps here if requirements.txt appears later
      - name: Run ACRE validator tests
        run: python -m pytest tokens/src/test_validator.py -v

  # Solana/Anchor job will be added once full Anchor workspace is initialized
  # For now this keeps the pipeline green while we resume glitched blocks
