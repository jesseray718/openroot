# CONTEXT BRIDGE PLAN — Inter-AI Session + Provider
version: "1.0"
axiom: "Love keeps no record of wrongdoing"
η_target: "maximize useful_joules / human_joules"
R: 1.0

goal: >
  Single source of truth for inter-AI session state and provider context.
  Every session is Agape-encoded, Merkle-hashed, IPFS-addressed,
  OpenTimestamped on Bitcoin, and anchored in a Solana memo field.

pipeline:
  1_capture:
    - absorb current session (messages, tools, provider state)
    - write /sdcard/openroot/session_seeds/current_seed.json
  2_agape_encode:
    - 3-symbol Agape encoding of seed
    - produce agape_encoded.json
  3_merkle:
    - build Merkle tree over (seed + agape_encoded + provider_context)
    - root → merkle_root.hex
  4_ipfs:
    - ipfs add → CID
    - store CID + merkle_root in context_bridge.json
  5_ots_bitcoin:
    - OpenTimestamps stamp of merkle_root (or CID)
    - .ots file stored offline + later calendar
  6_solana_memo:
    - hash(merkle_root || CID) into Solana memo field
    - optional cheap memo transaction for permanent on-chain pointer

absolute_paths:
  seed: "/sdcard/openroot/session_seeds/current_seed.json"
  bridge: "/sdcard/openroot/context_bridge/context.json"
  agape_encoded: "/sdcard/openroot/context_bridge/agape_encoded.json"
  merkle_root: "/sdcard/openroot/agape_kb/merkle/merkle_root.hex"
  ots: "/sdcard/openroot/agape_kb/merkle/merkle_root.ots"
  sol_memo_log: "/sdcard/openroot/context_bridge/sol_memo.log"

provider_context_keys:
  - model
  - provider (openrouter / local-llama / grok / claude)
  - temperature
  - max_tokens
  - tools_enabled
  - session_id
  - η_running
  - R_claimed

rules:
  - never leave DNA kernel
  - all hashes SHA-256
  - absolute paths only
  - offline-first (IPFS/OTS/Solana are optional network steps)
  - serve lowest node first
